<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">How the Detox E2E Showcase suite works</title><desc id="desc">Selected code-verified paths. Specs call flows and lifecycle hooks. Flows call pages and use testApi to read verification codes. Pages use selectors and Core controls. Core uses Detox to interact with the iOS sample app. The sample app calls the fake backend over HTTP. Lifecycle hooks start the backend, launch the app, and use testApi to reset and seed data. testApi calls test-only backend routes. Specs also use testApi to assert stored data.</desc><rect x="0" y="0" width="1600" height="800" rx="24" fill="#0E131B"/><text x="64" y="72" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#58D5EC">REACT NATIVE · END-TO-END TESTING</text><text x="64" y="132" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#F8FAFC">How the suite works</text><text x="64" y="180" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#AAB8CB">Layered UI actions, with a separate path to test data.</text><rect x="64" y="242" width="248" height="218" rx="16" fill="#151D28" stroke="#344052" stroke-width="2"/><rect x="370" y="242" width="248" height="218" rx="16" fill="#151D28" stroke="#344052" stroke-width="2"/><rect x="676" y="242" width="248" height="218" rx="16" fill="#151D28" stroke="#344052" stroke-width="2"/><rect x="982" y="242" width="248" height="218" rx="16" fill="#151D28" stroke="#344052" stroke-width="2"/><rect x="1288" y="242" width="248" height="218" rx="16" fill="#151D28" stroke="#344052" stroke-width="2"/><polyline points="324,344 357,344" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="348,338 357,344 348,350" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="630,344 663,344" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="654,338 663,344 654,350" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="936,344 969,344" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="960,338 969,344 960,350" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1242,344 1275,344" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1266,338 1275,344 1266,350" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="88" y="291" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#F8FAFC">Specs</text><text x="394" y="291" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#F8FAFC">Flows</text><text x="700" y="291" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#F8FAFC">Pages</text><text x="1006" y="291" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#F8FAFC">Core</text><text x="1312" y="291" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#F8FAFC">Detox</text><text x="88" y="335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#AAB8CB">Jest test cases</text><text x="88" y="410" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#58D5EC">ReturningUser</text><text x="394" y="335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#AAB8CB">Named journeys</text><text x="394" y="410" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#58D5EC">signInAs</text><text x="700" y="335" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#AAB8CB">Screen actions</text><rect x="696" y="374" width="208" height="58" rx="8" fill="#12313D"/><text x="710" y="410" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#58D5EC">Selectors · testIDs</text><text x="1006" y="335" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#58D5EC">Control</text><text x="1006" y="375" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#AAB8CB">Waits + actions</text><text x="1006" y="419" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#AAB8CB">Steps · action log</text><polyline points="1412,310 1412,342" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1406,333 1412,342 1418,333" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1312" y="382" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F8FAFC">Sample app</text><text x="1312" y="419" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#AAB8CB">iOS simulator</text><polyline points="188,473 188,540" fill="none" stroke="#344052" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="182,531 188,540 194,531" fill="none" stroke="#344052" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="203" y="509" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#AAB8CB">setup</text><rect x="64" y="552" width="248" height="134" rx="16" fill="#151D28" stroke="#344052" stroke-width="2"/><text x="88" y="592" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F8FAFC">Lifecycle hooks</text><text x="88" y="627" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#AAB8CB">Start backend;</text><text x="88" y="658" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#AAB8CB">launch fresh app</text><polyline points="325,619 357,619" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="348,613 357,619 348,625" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="494,473 494,540" fill="none" stroke="#344052" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="488,531 494,540 500,531" fill="none" stroke="#344052" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="509" y="509" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#AAB8CB">read codes</text><rect x="370" y="552" width="248" height="134" rx="16" fill="#151D28" stroke="#344052" stroke-width="2"/><text x="394" y="592" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F8FAFC">Data / testApi</text><text x="394" y="627" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#AAB8CB">Reset + seed data;</text><text x="394" y="658" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#AAB8CB">read codes + users</text><polyline points="632,619 969,619" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="960,613 969,619 960,625" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="664" y="596" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#58D5EC">HTTP · /__test__</text><polyline points="1412,473 1412,540" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="1406,531 1412,540 1418,531" fill="none" stroke="#58D5EC" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1432" y="509" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#AAB8CB">HTTP</text><rect x="982" y="552" width="554" height="134" rx="16" fill="#151D28" stroke="#344052" stroke-width="2"/><text x="1006" y="592" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Fake backend</text><text x="1006" y="631" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#AAB8CB">Node HTTP server · in-memory store</text><polyline points="64,724 1536,724" fill="none" stroke="#344052" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="64" y="763" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#AAB8CB">Selected paths shown. Specs also use testApi to assert stored data.</text></svg>